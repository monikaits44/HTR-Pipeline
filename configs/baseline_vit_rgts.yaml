# ViT-RGTS architecture for HTR on IAM (Vision Transformers Need Registers)
arch:
  type: 'vit_rgts'        # Vision Transformer with Register Tokens

  # Input resolution used in your pipeline
  image_height: 128
  image_width: 1024

  # Patch sizes (16x16 -> 8 x 64 = 512 patches)
  patch_height: 4
  patch_width: 64

  # ViT core dimensions
  dim: 256            # embedding dimension
  depth: 6            # number of transformer blocks
  heads: 8
  mlp_dim: 512

  # Register tokens (from the paper - key innovation!)
  num_registers: 0  # 4 register tokens for global information aggregation

  # Dropouts
  dropout: 0.1
  emb_dropout: 0.1

  # Head config
  head_type: 'rnn'    # RNN head on top of ViT features
  rnn_type: 'lstm'
  rnn_layers: 3
  rnn_hidden_size: 256

# Training settings
train:
  num_epochs: 100       # Testing: 5 epochs for register comparison
  batch_size: 8
