# architecture - CNN-RNN with dual head
arch:
  type: 'cnn_rnn'               # CNN + RNN architecture
  cnn_cfg: [[2, 64], 'M', [3, 128], 'M', [2, 256]]
  head_type: 'both'             # 'both' = CNN shortcut + RNN (paper's contribution)
  rnn_type: 'lstm'
  rnn_layers: 3
  rnn_hidden_size: 256
  flattening: 'maxpool'
  stn: False

# Stochastic Weight Averaging (SWA)
swa:
  enabled: false
  start_epoch: 110
  anneal_epochs: 10
  anneal_strategy: cos
  swa_lr: 5.0e-4
  update_bn_steps: 0
