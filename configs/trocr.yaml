# TrOCR encoder architecture for HTR on IAM
# Uses pretrained TrOCR encoder from HuggingFace transformers
#
# IMPORTANT: TrOCR was designed as encoder-decoder (not CTC). We use only
# the encoder here with a CTC head, which is suboptimal but compatible with
# the pipeline. The encoder's pretrained features are still valuable.
#
# INPUT HANDLING: Line images (128×1024) are resized to height=384 while
# preserving aspect ratio, then padded to 384×384. This avoids the
# destructive 8× horizontal squash that the old square resize caused.

arch:
  type: 'trocr'  # TrOCR encoder (ViT-based)

  # Model selection
  # Options:
  #   - microsoft/trocr-small-handwritten (smallest, fastest)
  #   - microsoft/trocr-base-handwritten (384x384, best for handwriting)
  #   - microsoft/trocr-large-handwritten (largest, most accurate)
  model_name: 'microsoft/trocr-base-handwritten'

  # TrOCR uses 384×384 input internally. Our pipeline resizes height to 384,
  # scales width proportionally, then pads to 384. This preserves aspect ratio.
  image_height: 384
  image_width: 384

  # Freeze pretrained encoder — it's already trained on handwriting data.
  # Only fine-tune the new CTC head (RNN) on IAM labels.
  # With 6.5K samples, fine-tuning all 86M encoder params causes overfitting.
  freeze_encoder: True

  # Head configuration
  head_type: 'rnn'         # Options: 'cnn' (linear), 'rnn', 'both'
  rnn_type: 'lstm'
  rnn_layers: 2
  rnn_hidden_size: 256

# Note: Training settings (lr, num_epochs, batch_size) inherited from config.yaml
# Override via CLI if needed: train.lr=5e-4 train.batch_size=4
